services:
  admin:
    build:
      context: ./admin
      dockerfile: Dockerfile
    container_name: yeyi_blog_admin
    ports:
      - "3001:80"

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: yeyi_blog_backend
    ports:
      - "8000:8000"
    environment:
      - DATABASE_URL=mysql+asyncmy://root:root@mysql:3306/yeyi_blog
      - REDIS_URL=redis://redis:6379/0
      - JWT_SECRET_KEY=change-me-in-production
      - MCP_API_KEY=${MCP_API_KEY:-change-me-mcp-key}
      - MCP_SETTINGS_ENCRYPTION_KEY=${MCP_SETTINGS_ENCRYPTION_KEY:-2Lgqs7X5oGrSOqBHg7zrkueOGjRreTHlg7u2JA3Y0YM=}
      - MCP_PUBLIC_URL=${MCP_PUBLIC_URL:-http://localhost:8100/mcp}
      - MCP_RATE_LIMIT=${MCP_RATE_LIMIT:-120}
      - MCP_RATE_WINDOW=${MCP_RATE_WINDOW:-60}
      - MCP_ALLOWED_HOSTS=${MCP_ALLOWED_HOSTS:-[]}
      - MCP_ALLOWED_ORIGINS=${MCP_ALLOWED_ORIGINS:-[]}
    volumes:
      - uploads_data:/backend/uploads
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy

  mcp:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: yeyi_blog_mcp
    ports:
      - "8100:8100"
    command: ["uvicorn", "app.mcp_server:app", "--host", "0.0.0.0", "--port", "8100"]
    environment:
      - DATABASE_URL=mysql+asyncmy://root:root@mysql:3306/yeyi_blog
      - REDIS_URL=redis://redis:6379/0
      - MCP_API_KEY=${MCP_API_KEY:-change-me-mcp-key}
      - MCP_SETTINGS_ENCRYPTION_KEY=${MCP_SETTINGS_ENCRYPTION_KEY:-2Lgqs7X5oGrSOqBHg7zrkueOGjRreTHlg7u2JA3Y0YM=}
      - MCP_PUBLIC_URL=${MCP_PUBLIC_URL:-http://localhost:8100/mcp}
      - MCP_RATE_LIMIT=${MCP_RATE_LIMIT:-120}
      - MCP_RATE_WINDOW=${MCP_RATE_WINDOW:-60}
      - MCP_ALLOWED_HOSTS=${MCP_ALLOWED_HOSTS:-[]}
      - MCP_ALLOWED_ORIGINS=${MCP_ALLOWED_ORIGINS:-[]}
    volumes:
      - uploads_data:/backend/uploads
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: yeyi_blog_frontend
    ports:
      - "3000:3000"
    environment:
      - NUXT_API_BASE=http://backend:8000/api/v1
      - NUXT_PUBLIC_API_BASE=http://localhost:8000/api/v1
      - NUXT_PUBLIC_ADMIN_URL=http://localhost:3001

  mysql:
    image: mysql:8.0
    container_name: mysql
    command: --default-authentication-plugin=mysql_native_password
    ports:
      - "3306:3306"
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: yeyi_blog
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
volumes:
  mysql_data:
  redis_data:
  uploads_data:
  
