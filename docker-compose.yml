services:
  admin:
    build:
      context: ./admin
      dockerfile: Dockerfile
    container_name: yeyi_blog_admin

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: yeyi_blog_backend
    environment:
      - DATABASE_URL=mysql+asyncmy://root:root@mysql:3306/yeyi_blog
      - REDIS_URL=redis://redis:6379/0
      - JWT_SECRET_KEY=change-me-in-production
    volumes:
      - uploads_data:/backend/uploads
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: yeyi_blog_frontend
    environment:
      - NUXT_API_BASE=http://backend:8000/api/v1
      
  gateway:
    image: nginx:alpine
    container_name: yeyi_blog_gateway
    ports:
      - "80:80"
    volumes:
    - ./gateway.conf:/etc/nginx/conf.d/default.conf
    depends_on:
      - admin
      - backend
      - frontend

  mysql:
    image: mysql:8.0
    container_name: mysql
    command: --default-authentication-plugin=mysql_native_password
    ports:
      - "3306:3306"
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: yeyi_blog
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
volumes:
  mysql_data:
  redis_data:
  uploads_data:
  
