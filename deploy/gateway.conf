resolver 127.0.0.11 valid=30s;

server {
    listen 80;
    listen 443 ssl;
    server_name blog.yeyeyiyi.online;
    ssl_certificate     /YeYi-blog/blog;
    ssl_certificate_key /YeYi-blog/blog-key;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    client_max_body_size 10m;

    location /api/ {
        set $backend backend:8000;
        proxy_pass http://$backend;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /uploads/ {
        set $backend backend:8000;
        proxy_pass http://$backend;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    location / {
        proxy_pass http://frontend:3000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}

server {
    listen 80;
    listen 443 ssl;
    server_name admin.yeyeyiyi.online;
    ssl_certificate     /YeYi-blog/admin;
    ssl_certificate_key /YeYi-blog/admin-key;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    client_max_body_size 10m;

    location /api/ {
        set $backend backend:8000;
        proxy_pass http://$backend;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /uploads/ {
        set $backend backend:8000;
        proxy_pass http://$backend;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    location / {
        proxy_pass http://admin:80;
    }
}

server {
    listen 80;
    listen 443 ssl;
    server_name api.yeyeyiyi.online;
    ssl_certificate     /YeYi-blog/api;
    ssl_certificate_key /YeYi-blog/api-key;

    # 与 blog/admin 块对齐：后端支持 5MB 上传，nginx 默认 1m 会提前 413
    client_max_body_size 10m;

    location / {
        set $backend backend:8000;
        proxy_pass http://$backend;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}

server {
    listen 80;
    listen 443 ssl;
    server_name blogmcp.yeyeyiyi.online;
    ssl_certificate     /YeYi-blog/blogmcp;
    ssl_certificate_key /YeYi-blog/blogmcp-key;

    # MAX_UPLOAD_SIZE 5MB arrives base64-encoded (~6.7MiB) plus JSON overhead
    client_max_body_size 12m;

    location /mcp {
        set $mcp mcp:8100;
        proxy_pass http://$mcp;
        proxy_http_version 1.1;
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /uploads/ {
        set $backend backend:8000;
        proxy_pass http://$backend;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    location = /health {
        set $mcp mcp:8100;
        proxy_pass http://$mcp/health;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}

server {
    listen 443 ssl;
    server_name tavily.yeyeyiyi.online;
    ssl_certificate     /tavily-ssl/tavily;
    ssl_certificate_key /tavily-ssl/tavily-key;

    location / {
        set $tavily 10.0.0.8:8000;
        proxy_pass http://$tavily;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}

server {
        listen       443 ssl;
        listen  [::]:443 ssl;
        server_name obsidian.yeyeyiyi.online;

        client_max_body_size 50m;
        proxy_max_temp_file_size 0;
        proxy_buffering off;

        ssl_certificate      /cert.pem;
        ssl_certificate_key  /privkey.pem;
        ssl_protocols TLSv1 TLSv1.1 TLSv1.2;
        ssl_ciphers EECDH+CHACHA20:EECDH+AES128:RSA+AES128:EECDH+AES256:RSA+AES256:EECDH+3DES:RSA+3DES:!MD5;
        ssl_prefer_server_ciphers on;

        location / {
                proxy_pass http://10.0.0.8:9000;
                proxy_set_header Host $host;
                proxy_set_header X-Real-IP $remote_addr;
                proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
                proxy_set_header X-Forwarded-Proto $scheme;
        }

        location /api/user/sync {
                proxy_pass http://10.0.0.8:9000/api/user/sync;
                proxy_http_version 1.1;
                proxy_set_header Upgrade $http_upgrade;
                proxy_set_header Connection "upgrade";
                proxy_set_header Host $host;
                proxy_set_header X-Real-IP $remote_addr;
                proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
                proxy_set_header X-Forwarded-Proto $scheme;
        }
}
